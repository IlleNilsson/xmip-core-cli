[package]
name = "xmip-core-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-cli"
description = "The xmip command line over a running Xmip, in Rust and needing no .NET: text for a person, --json for a program, --follow as JSON Lines, every command audited, and xmip mcp, a Model Context Protocol server on stdin and stdout, over xmip-core-operate's surface and the runtime's crates."
publish.workspace = true
# Copies cli.toml beside the executable and links the Xmip mark into it as
# its Windows icon.
build = "build.rs"

[lib]
path = "src/lib.rs"

# The command a person types: the owner, 2026-10-22, "Xmip CLI should be
# named just xmip" (ADR-0014, amendment 2026-10-22).
[[bin]]
name = "xmip"
path = "src/main.rs"

[dependencies]
# Rust to Rust, through traits (ADR-0014, amendment 2026-10-12): the
# surface every command reads (`operate::surface`) — a published snapshot,
# or a node's operate listener here or on another machine — and the
# runtime's rules it is composed of.
operate = { workspace = true }
runtime = { workspace = true }
observe = { workspace = true }
node = { workspace = true }
# The two boundaries this build speaks and what a status code means
# (`xmip abi`, `xmip status`).
abi = { workspace = true }
# The Clock, an audit record's phase and severity.
xcore = { workspace = true }
# Every invocation audited through the one audit capability (ADR-0062),
# handed the file sink and the operating system's log of its platform for
# when the records cannot persist. Each log's crate is empty off its own
# platform, so each is a dependency of its own platform alone, in the target
# tables below (ADR-0062, amendment 2026-11-19).
xaudit = { workspace = true }
audit-file = { workspace = true }
# JSON-RPC 2.0 and its framing one message a line, which `xmip mcp` speaks
# (`net::rpc`).
net = { workspace = true, features = ["rpc"] }
# A document for a program, written by hand with the escaping the command
# line always wrote (`json`); a request read and an MCP message's id.
serde_json = "1"
# A moment as a date and a time of day (`codec::civil`), for the times a
# document and a line say.
codec = { workspace = true }
# A person's key and request made, and a node's key and certificate issued
# by the cluster's authority (`xmip certificate`; ADR-0034, amendment
# 2026-10-15).
provision = { workspace = true }

[dev-dependencies]
# A certificate's leaf read back, which a certificate test holds to its
# subject.
tls = { workspace = true }
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

# Ctrl+C ends a follow cleanly, and who the command runs as; and the
# operating system's log of each platform.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
audit-windows-event-log = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }
audit-syslog = { workspace = true }

[lints.rust]
# deny, not forbid: Ctrl+C is the operating system's to hand over, and
# `src/system/` is the one folder that asks it, each file lowering this at
# its top with its reason.
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
