name: Verify

# Automatic push, pull-request and scheduled triggers are intentionally absent.
on:
  workflow_dispatch:

permissions:
  contents: read

# A .NET repository verified in its own language (ADR-0052 clause 6). The
# shared rust-verify.yml ran here until 2026-09-11 over a repository with no
# Cargo.toml in it.
#
# The executable references Xmip.Abi and Xmip.Surface by path inside the
# composed estate (ADR-0014, amendment of 2026-09-09; ADR-0052, amendment
# 2026-11-16), so the binding's repository and the one Xmip.Surface and its
# Operate model are in are checked out where the paths expect them:
# module/foundation/abi and module/core/operation/operate beside
# module/core/operation/cli. Their main is what the estate tracks (ADR-0005).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: module/core/operation/cli

      - name: Check out xmip-core-abi where the estate mounts it
        uses: actions/checkout@v7
        with:
          repository: IlleNilsson/xmip-core-abi
          ref: main
          path: module/foundation/abi

      - name: Check out xmip-core-operate beside it
        uses: actions/checkout@v7
        with:
          repository: IlleNilsson/xmip-core-operate
          ref: main
          path: module/core/operation/operate

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: module/core/operation/cli/global.json

      - name: Build
        run: dotnet build module/core/operation/cli/src/Xmip.Cli.Test/Xmip.Cli.Test.csproj

      - name: Test
        run: >-
          dotnet test module/core/operation/cli/src/Xmip.Cli.Test/Xmip.Cli.Test.csproj
          --no-build
